<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">OpenStack lab: physical and logical topology</title>
  <desc id="desc">A conceptual three-node, multi-role OpenStack lab with a management VM. Each node has a management NIC and a USB provider NIC. The home LAN is 192.168.0.0/24 with gateway 192.168.0.1, API VIP 192.168.0.150, and floating IP pool 192.168.0.151 through 192.168.0.199. A Neutron router links the provider network to a private VM subnet 10.254.211.0/24. Security groups filter traffic to the VM. Addresses on the home LAN are private, not public internet addresses. Diagram is conceptual, not a claim about deployed configuration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#60748a"/></marker>
  </defs>
  <rect width="1200" height="790" rx="20" fill="#f7f9fc"/>
  <g font-family="Inter, Arial, sans-serif" fill="#172b45">
    <text x="48" y="55" font-size="30" font-weight="700">OpenStack lab topology</text>
    <text x="48" y="84" font-size="17" fill="#53677f">Conceptual view · physical connections and logical networks</text>
    <!-- Network rails and connections -->
    <rect x="48" y="120" width="1104" height="84" rx="14" fill="#e8f5f3" stroke="#68b8aa" stroke-width="2"/>
    <text x="72" y="151" font-size="20" font-weight="700" fill="#155c54">Home LAN / provider network</text>
    <text x="72" y="180" font-size="17">192.168.0.0/24  ·  gateway 192.168.0.1</text>
    <text x="655" y="151" font-size="16" font-weight="700">API VIP  192.168.0.150</text>
    <text x="655" y="180" font-size="16">Floating IP pool  192.168.0.151–192.168.0.199</text>
    <path d="M 380 204 V 258 M 640 204 V 258 M 900 204 V 258" fill="none" stroke="#219681" stroke-width="3"/>
    <path d="M 120 430 V 470 M 380 430 V 470 M 640 430 V 470 M 900 430 V 470" fill="none" stroke="#6083bf" stroke-width="3"/>
    <!-- Four machines -->
    <rect x="48" y="290" width="155" height="140" rx="14" fill="#fff" stroke="#99acc4" stroke-width="2"/>
    <text x="68" y="326" font-size="19" font-weight="700">Management</text>
    <text x="68" y="350" font-size="19" font-weight="700">VM</text>
    <text x="68" y="398" font-size="15" fill="#53677f">Management</text>
    <text x="68" y="417" font-size="15" fill="#53677f">interface</text>
    <g>
      <rect x="250" y="258" width="246" height="172" rx="14" fill="#fff" stroke="#99acc4" stroke-width="2"/>
      <rect x="510" y="258" width="246" height="172" rx="14" fill="#fff" stroke="#99acc4" stroke-width="2"/>
      <rect x="770" y="258" width="246" height="172" rx="14" fill="#fff" stroke="#99acc4" stroke-width="2"/>
      <text x="272" y="291" font-size="20" font-weight="700">Node 1</text><text x="532" y="291" font-size="20" font-weight="700">Node 2</text><text x="792" y="291" font-size="20" font-weight="700">Node 3</text>
      <text x="272" y="316" font-size="15" fill="#53677f">Multi-role OpenStack host</text><text x="532" y="316" font-size="15" fill="#53677f">Multi-role OpenStack host</text><text x="792" y="316" font-size="15" fill="#53677f">Multi-role OpenStack host</text>
      <text x="272" y="357" font-size="16" fill="#155c54">●  USB provider NIC</text><text x="532" y="357" font-size="16" fill="#155c54">●  USB provider NIC</text><text x="792" y="357" font-size="16" fill="#155c54">●  USB provider NIC</text>
      <text x="272" y="400" font-size="16" fill="#365f9f">●  Management NIC</text><text x="532" y="400" font-size="16" fill="#365f9f">●  Management NIC</text><text x="792" y="400" font-size="16" fill="#365f9f">●  Management NIC</text>
    </g>
    <rect x="48" y="470" width="1104" height="62" rx="14" fill="#eaf0fb" stroke="#8ba9d7" stroke-width="2"/>
    <text x="72" y="508" font-size="19" font-weight="700" fill="#365f9f">Management network</text>
    <text x="380" y="508" font-size="16" fill="#53677f">Management VM and node management interfaces</text>
    <!-- Logical inset -->
    <rect x="48" y="564" width="1104" height="120" rx="14" fill="#fff" stroke="#d3dce8" stroke-width="2"/>
    <text x="72" y="594" font-size="15" font-weight="700" fill="#53677f">LOGICAL TENANT NETWORK  ·  conceptual overlay</text>
    <rect x="72" y="611" width="205" height="49" rx="9" fill="#e8f5f3"/><text x="88" y="641" font-size="16" font-weight="700">Provider network</text>
    <path d="M 282 635 H 344" stroke="#60748a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 344 643 H 282" stroke="#60748a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="355" y="611" width="205" height="49" rx="9" fill="#fef2db"/><text x="372" y="641" font-size="16" font-weight="700">Neutron router</text>
    <path d="M 565 635 H 627" stroke="#60748a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 627 643 H 565" stroke="#60748a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="638" y="611" width="310" height="49" rx="9" fill="#edf1ff"/><text x="654" y="641" font-size="16" font-weight="700">VM subnet  10.254.211.0/24</text>
    <text x="964" y="632" font-size="15" fill="#53677f">VM + security</text><text x="964" y="651" font-size="15" fill="#53677f">group rules</text>
    <text x="48" y="726" font-size="15" fill="#53677f">Legend:  <tspan fill="#219681" font-weight="700">━━</tspan> provider connection    <tspan fill="#6083bf" font-weight="700">━━</tspan> management connection    ⇄ logical traffic</text>
    <text x="48" y="755" font-size="15" fill="#53677f">Home-LAN floating IPs are private addresses. This diagram describes an intended design, not verified configuration.</text>
  </g>
</svg>